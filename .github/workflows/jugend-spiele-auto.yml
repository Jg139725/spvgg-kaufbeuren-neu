name: Jugend Spielplan (BFV) aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: write

concurrency:
  group: jugend-spiele-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Abhängigkeiten installieren
        run: pip install requests pdfplumber

      - name: BFV-Vereinsspielplan auslesen
        run: python scripts/update_jugend_spiele.py

      - name: Nächste Spiele und Tabellen der Jugend (BFV) auslesen
        continue-on-error: true
        run: python scripts/update_jugend_bfv.py

      - name: Änderungen speichern
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="data/jugend-spiele.json data/jugend-bfv.json assets/images/vereine"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Keine Änderungen an den Jugenddaten."
            exit 0
          fi
          # Neue Dateien sichern, auf den aktuellen Stand von main gehen, dann wieder einspielen
          rm -rf /tmp/jugend && mkdir -p /tmp/jugend
          for f in $FILES; do
            if [ -e "$f" ]; then mkdir -p "/tmp/jugend/$(dirname "$f")"; cp -R "$f" "/tmp/jugend/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          cp -R /tmp/jugend/. .
          git add $FILES
          if git diff --cached --quiet; then
            echo "Keine Änderungen nach Synchronisierung."
            exit 0
          fi
          git commit -m "Jugend-Spielplan und Tabellen (BFV) automatisch aktualisiert"
          git push origin HEAD:main
