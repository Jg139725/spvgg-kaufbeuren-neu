<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVK Damenverwaltung</title><style>body{font:16px system-ui;background:#eef3fa;color:#13233d;margin:0}main{max-width:900px;margin:30px auto;padding:24px;background:white;border-radius:18px}input,textarea,button{font:inherit;padding:10px;border:1px solid #ccd7e6;border-radius:8px;box-sizing:border-box}input,textarea{width:100%}label{display:block;margin:14px 0}button{cursor:pointer;background:#0753a5;color:white;border:0;margin:5px}.item{padding:14px;border:1px solid #dbe3ee;margin:10px 0;border-radius:10px;display:grid;grid-template-columns:1fr 100px;gap:8px}.item input{grid-column:span 1}h1,h2{color:#082c59}.hidden{display:none}#status{white-space:pre-wrap}</style><main><h1>SVK Damenredaktion</h1><p>Nur für Damenredaktion und Administratoren. Bestehende Spielerinnen werden beim ersten Speichern übernommen.</p><section id="login"><label>E-Mail<input id="email" type="email"></label><label>Passwort<input id="password" type="password"></label><button id="signIn">Anmelden</button></section><section id="app" class="hidden"><button id="signOut">Abmelden</button><h2>Spielerinnen</h2><div id="players"></div><button id="add">+ Spielerin hinzufügen</button><h2>Mannschaftsseite</h2><label>Einleitung<textarea id="intro" rows="3"></textarea></label><label>Text im Kopfbereich<textarea id="hero_text" rows="3"></textarea></label><label>Mannschaftsfoto (Bild-URL)<input id="team_photo" placeholder="https://..."></label><label>Neues Mannschaftsfoto hochladen<input type="file" id="photoUpload" accept="image/*"></label><button id="save">Alle Änderungen speichern</button></section><p id="status" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/damen-admin-v78.js"></script></html>
